receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  batch:

exporters:
  zipkin:
    endpoint: "http://jaeger:9411/api/v2/spans"

  debug:
    verbosity: detailed

  # Exporta métricas usando o formato Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [zipkin, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
