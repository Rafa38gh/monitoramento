server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Pod = container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: pod

      # Mantém também container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # Namespace
      - target_label: namespace
        replacement: docker

      # App
      - source_labels: ['__meta_docker_container_name']
        target_label: app

      # Image
      - source_labels: ['__meta_docker_container_image']
        target_label: image

      # Stream (stdout/stderr)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

    pipeline_stages:
      - docker: {}

      - json:
          expressions:
            level: level
            msg: message
          drop_malformed: false

      - logfmt:
          mapping:
            level: level

      - template:
          source: level
          template: '{{ ToLower .Value }}'

      - labels:
          level: